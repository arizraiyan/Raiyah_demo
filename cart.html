<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your bag — Jay Mataji Creation</title>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/luxe.css">
<style>
.checkout{display:grid;grid-template-columns:1fr 372px;gap:40px;align-items:start;}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:28px;}
.panel h3{font-size:22px;margin-bottom:6px;}
.panel .sub{font-size:13px;color:var(--ink-soft);margin-bottom:22px;}
.summary{position:sticky;top:100px;}
.big-row{display:flex;gap:18px;padding:20px 0;border-bottom:1px solid var(--line);align-items:flex-start;}
.big-row:last-of-type{border-bottom:none;}
.big-row img{width:104px;height:132px;object-fit:cover;border-radius:2px;flex:none;background:var(--surface-2);}
.big-row .info{flex:1;min-width:0;}
.big-row h4{font-family:var(--f-body);font-size:15.5px;font-weight:600;margin-bottom:5px;}
.big-row .meta{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;color:var(--ink-faint);margin-bottom:10px;}
.big-row .amt{font-family:var(--f-mono);font-size:17px;font-weight:600;text-align:right;flex:none;}
.row-tools{display:flex;align-items:center;gap:16px;margin-top:12px;flex-wrap:wrap;}
.link-x{background:none;border:none;cursor:pointer;font-family:var(--f-mono);font-size:9.5px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);}
.link-x:hover{color:var(--bad);}
.steps-bar{display:flex;gap:0;margin-bottom:32px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
.sbar{flex:1;padding:14px;text-align:center;font-family:var(--f-mono);font-size:9.5px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);background:var(--surface);
  border-right:1px solid var(--line);}
.sbar:last-child{border:none;}
.sbar.on{background:var(--btn-bg);color:var(--btn-fg);}
.sbar.done{color:var(--ok);}
.pay-choice{display:flex;gap:14px;align-items:center;padding:18px;border:1px solid var(--line-2);
  border-radius:var(--radius);background:var(--surface-2);margin-bottom:16px;}
.pc-mark{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--gold),var(--gold-hi));color:#fff;font-size:23px;}
.pc-copy b{display:block;font-size:14.5px;margin-bottom:3px;}
.pc-copy small{font-size:12.5px;color:var(--ink-soft);line-height:1.6;}
.pay-logos{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;}
.pay-logos .pl{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);
  font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);
  border:1px solid var(--line);padding:7px 11px;border-radius:20px;}
.pay-logos .pl i{font-size:14px;color:var(--gold);}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.done-card{max-width:560px;margin:0 auto;text-align:center;}
.done-tick{width:76px;height:76px;border-radius:50%;background:var(--ok);color:#fff;
  display:grid;place-items:center;font-size:40px;margin:0 auto 24px;animation:pop .6s cubic-bezier(.3,1.6,.5,1);}
@media(max-width:900px){
  .checkout{grid-template-columns:1fr;}
  .summary{position:static;}
  .two{grid-template-columns:1fr;}
  .big-row img{width:78px;height:100px;}
}
</style>
</head>
<body>

<section class="page-hero">
  <div class="wrap">
    <div class="crumbs"><a href="index.html">Home</a> / Your bag</div>
    <h1 class="display-l">Your bag</h1>
  </div>
</section>

<section class="section tight wrap" id="root"></section>

<script src="assets/js/data.js"></script>
<script src="assets/js/brand.js"></script>
<script src="assets/js/qr.js"></script>
<script src="assets/js/carousel.js"></script>
<script src="assets/js/payments.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/fx.js"></script>
<script>
JMC.boot('shop.html');

let step = 1;           // 1 bag · 2 address · 3 payment · 4 done
let placed = null;
const addr = { name:'', phone:'', line1:'', city:'', state:'Gujarat', pin:'', landmark:'' };
let payMethod = 'cod';

function totals(){
  const sub = JMC.cartTotal();
  const ship = sub === 0 ? 0 : (sub >= 2999 ? 0 : 99);
  return { sub, ship, grand: sub + ship };
}

function summaryHTML(cta){
  const { sub, ship, grand } = totals();
  const n = JMC.cartCount();
  return `<aside class="panel summary">
    <h3>Order summary</h3>
    <p class="sub">${n} item${n===1?'':'s'} in your bag</p>
    <div class="d-line"><span>Subtotal</span><span>${JMC.rs(sub)}</span></div>
    <div class="d-line"><span>Delivery</span><span>${ship ? JMC.rs(ship) : 'Free'}</span></div>
    ${ship ? `<div style="font-size:11.5px;color:var(--gold);margin:-2px 0 8px">
      Add ${JMC.rs(2999 - sub)} more for free delivery</div>` : ''}
    <div class="d-line total"><span>Total</span><b>${JMC.rs(grand)}</b></div>
    ${cta}
    <div style="margin-top:18px;display:flex;flex-direction:column;gap:10px;
      font-size:12px;color:var(--ink-soft)">
      <span><i class='bx bx-lock-alt' style="color:var(--gold)"></i> Your details stay on your device</span>
      <span><i class='bx bx-refresh' style="color:var(--gold)"></i> 7-day exchange on unworn pieces</span>
      <span><i class='bx bx-ruler' style="color:var(--gold)"></i> Free fit adjustment before dispatch</span>
    </div>
  </aside>`;
}

function render(){
  const root = document.getElementById('root');
  const items = JMC.cart();

  if (step === 4 && placed) { renderDone(); return; }

  if (!items.length) {
    root.innerHTML = `<div class="empty-state"><i class='bx bx-shopping-bag'></i>
      <h4>Your bag is empty</h4><p>Once you add a piece it will show up here, and stay here until you check out.</p>
      <a href="shop.html" class="btn btn-solid">Browse the collection</a></div>`;
    return;
  }

  const bar = `<div class="steps-bar">
    <div class="sbar ${step===1?'on':step>1?'done':''}">1 · Your bag</div>
    <div class="sbar ${step===2?'on':step>2?'done':''}">2 · Delivery address</div>
    <div class="sbar ${step===3?'on':''}">3 · Payment</div></div>`;

  if (step === 1) {
    root.innerHTML = bar + `<div class="checkout">
      <div class="panel">
        <h3>Review your pieces</h3>
        <p class="sub">Change size or quantity here before you check out.</p>
        ${items.map(i => `
          <div class="big-row">
            <img src="assets/img/${i.img}-960.jpg" alt="${JMC.esc(i.name)}">
            <div class="info">
              <h4><a href="product.html?sku=${i.sku}">${JMC.esc(i.name)}</a></h4>
              <div class="meta">${i.sku} · Size ${i.size}</div>
              <div class="rs" style="font-family:var(--f-mono);color:var(--gold);font-size:14px">${JMC.rs(i.price)} each</div>
              <div class="row-tools">
                <div class="qty">
                  <button data-dec="${i.key}" aria-label="Decrease">−</button><span>${i.qty}</span>
                  <button data-inc="${i.key}" aria-label="Increase">+</button></div>
                <button class="link-x" data-del="${i.key}">Remove</button>
                <button class="link-x" data-wish="${i.sku}">Save for later</button>
              </div>
            </div>
            <div class="amt">${JMC.rs(i.price * i.qty)}</div>
          </div>`).join('')}
        <div style="margin-top:24px"><a href="shop.html" class="btn btn-line btn-sm">
          <i class='bx bx-left-arrow-alt'></i> Keep shopping</a></div>
      </div>
      ${summaryHTML(`<button class="btn btn-solid btn-block" id="go2">Continue to address</button>`)}
    </div>`;

    root.querySelectorAll('[data-inc]').forEach(b => b.onclick = () => { const k=b.dataset.inc; JMC.setQty(k, JMC.cart().find(i=>i.key===k).qty+1); render(); });
    root.querySelectorAll('[data-dec]').forEach(b => b.onclick = () => { const k=b.dataset.dec; JMC.setQty(k, JMC.cart().find(i=>i.key===k).qty-1); render(); });
    root.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { JMC.removeItem(b.dataset.del); render(); });
    root.querySelectorAll('[data-wish]').forEach(b => b.onclick = () => { JMC.toggleWish(b.dataset.wish); });
    document.getElementById('go2').onclick = () => {
      if (!JMC.requireAuth('cart.html')) return;
      const u = JMC.currentUser();
      addr.name = addr.name || u.name; addr.phone = addr.phone || u.phone;
      step = 2; render(); scrollTo({top:0,behavior:'smooth'});
    };
  }

  if (step === 2) {
    const saved = (JMC.currentUser().addresses || []);
    root.innerHTML = bar + `<div class="checkout">
      <div class="panel">
        <h3>Where should it go?</h3>
        <p class="sub">We ship across India. Bridal orders get a call before dispatch.</p>
        ${saved.length ? `<div class="field"><label>Use a saved address</label>
          <select class="input" id="saved-pick"><option value="">Enter a new address</option>
          ${saved.map((a,i) => `<option value="${i}">${JMC.esc(a.line1)}, ${JMC.esc(a.city)} — ${JMC.esc(a.pin)}</option>`).join('')}
          </select></div>` : ''}
        <div class="two">
          <div class="field"><label>Full name</label><input class="input" id="a-name" value="${JMC.esc(addr.name)}" placeholder="Riddhi Patel"></div>
          <div class="field"><label>Mobile number</label><input class="input" id="a-phone" value="${JMC.esc(addr.phone)}" placeholder="98250 00000"></div>
        </div>
        <div class="field"><label>Flat, building, street</label>
          <input class="input" id="a-line1" value="${JMC.esc(addr.line1)}" placeholder="B-402, Shreeji Residency, Bhairavnath Road"></div>
        <div class="two">
          <div class="field"><label>City</label><input class="input" id="a-city" value="${JMC.esc(addr.city)}" placeholder="Ahmedabad"></div>
          <div class="field"><label>State</label><input class="input" id="a-state" value="${JMC.esc(addr.state)}"></div>
        </div>
        <div class="two">
          <div class="field"><label>PIN code</label><input class="input" id="a-pin" value="${JMC.esc(addr.pin)}" placeholder="380008" inputmode="numeric" maxlength="6"></div>
          <div class="field"><label>Landmark (optional)</label><input class="input" id="a-land" value="${JMC.esc(addr.landmark)}" placeholder="Near Jain temple"></div>
        </div>
        <div class="err-msg" id="a-err"></div>
        <div style="display:flex;gap:12px;flex-wrap:wrap">
          <button class="btn btn-line" id="back1"><i class='bx bx-left-arrow-alt'></i> Back to bag</button>
          <button class="btn btn-solid" id="go3" style="flex:1">Continue to payment</button>
        </div>
      </div>
      ${summaryHTML('')}
    </div>`;

    const pick = document.getElementById('saved-pick');
    if (pick) pick.onchange = () => {
      const a = saved[pick.value]; if (!a) return;
      Object.assign(addr, a); step = 2; render();
    };
    document.getElementById('back1').onclick = () => { step = 1; render(); };
    document.getElementById('go3').onclick = () => {
      addr.name = document.getElementById('a-name').value.trim();
      addr.phone = document.getElementById('a-phone').value.trim();
      addr.line1 = document.getElementById('a-line1').value.trim();
      addr.city = document.getElementById('a-city').value.trim();
      addr.state = document.getElementById('a-state').value.trim();
      addr.pin = document.getElementById('a-pin').value.trim();
      addr.landmark = document.getElementById('a-land').value.trim();
      const err = document.getElementById('a-err');
      if (addr.name.length < 2) return err.textContent = 'Enter the name for the delivery.';
      if (!/^[\d+\s-]{10,15}$/.test(addr.phone)) return err.textContent = 'Enter a 10-digit mobile number.';
      if (addr.line1.length < 6) return err.textContent = 'Enter the flat and street.';
      if (!addr.city) return err.textContent = 'Enter the city.';
      if (!/^\d{6}$/.test(addr.pin)) return err.textContent = 'PIN code must be 6 digits.';
      /* save address to profile */
      const u = JMC.currentUser(); const list = u.addresses || [];
      if (!list.some(a => a.line1 === addr.line1 && a.pin === addr.pin)) { list.push({...addr}); JMC.updateUser({ addresses:list }); }
      step = 3; render(); scrollTo({top:0,behavior:'smooth'});
    };
  }

  if (step === 3) {
    const { grand } = totals();
    root.innerHTML = bar + `<div class="checkout">
      <div class="panel">
        <h3>How would you like to pay?</h3>
        <p class="sub">Shipping to ${JMC.esc(addr.line1)}, ${JMC.esc(addr.city)} — ${JMC.esc(addr.pin)}</p>

        <div class="pay-choice">
          <div class="pc-mark"><i class='bx bx-shield-quarter'></i></div>
          <div class="pc-copy">
            <b>UPI, card, netbanking, wallet or cash</b>
            <small>Pick your method on the next screen. UPI opens a live code you can scan with any app.</small>
          </div>
        </div>

        <div class="pay-logos">
          <span class="pl"><i class='bx bx-qr-scan'></i> UPI</span>
          <span class="pl"><i class='bx bx-credit-card-front'></i> Visa · Mastercard · RuPay</span>
          <span class="pl"><i class='bx bx-building-house'></i> Netbanking</span>
          <span class="pl"><i class='bx bx-wallet'></i> Wallets</span>
          <span class="pl"><i class='bx bx-money'></i> Cash on delivery</span>
        </div>

        <div class="err-msg" id="p-err"></div>
        <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:8px">
          <button class="btn btn-line" id="back2"><i class='bx bx-left-arrow-alt'></i> Back</button>
          <button class="btn btn-gold" id="place" style="flex:1">Pay ${JMC.rs(grand)}</button>
        </div>
      </div>
      ${summaryHTML('')}
    </div>`;

    document.getElementById('back2').onclick = () => { step = 2; render(); };
    document.getElementById('place').onclick = () => {
      const { sub, ship, grand } = totals();
      JMCPay.open({
        amount: grand,
        orderRef: 'JMC' + Date.now().toString(36).toUpperCase(),
        onDone: result => {
          payMethod = result.method;
          placed = JMC.placeOrder({
            items: JMC.cart(), address: {...addr},
            payment: result.method,
            paymentLabel: result.label,
            paymentRef: result.ref,
            paymentPending: !!result.pending,
            total: sub, shipping: ship + (result.fee || 0),
            user: JMC.currentUser()
          });
          step = 4; render(); scrollTo({top:0,behavior:'smooth'});
          JMC.toast(result.pending ? 'Order placed — payment being verified'
                                   : 'Order placed — thank you', 'ok');
        }
      });
    };
  }

}

function renderDone(){
  if (!placed) { step = 1; render(); return; }
  const payNames = { cod:'Cash on delivery', upi:'UPI', card:'Card', bank:'Bank transfer' };
  document.getElementById('root').innerHTML = `
    <div class="panel done-card">
      <div class="done-tick"><i class='bx bx-check'></i></div>
      <h2 class="display-m">Order placed</h2>
      <p class="lede" style="margin:14px auto 26px">Thank you, ${JMC.esc(placed.userName.split(' ')[0])}. We have your order and will confirm it on ${JMC.esc(placed.phone)} within a few hours.</p>
      <div style="background:var(--surface-2);border-radius:var(--radius);padding:22px;text-align:left;margin-bottom:26px">
        <div class="d-line"><span>Order number</span><b style="font-family:var(--f-mono);color:var(--gold)">${placed.id}</b></div>
        <div class="d-line"><span>Items</span><span>${placed.items.reduce((n,i)=>n+i.qty,0)}</span></div>
        <div class="d-line"><span>Payment</span><span>${JMC.esc(placed.paymentLabel || payNames[placed.payment] || placed.payment)}</span></div>
        ${placed.paymentRef ? `<div class="d-line"><span>Reference</span><span>${JMC.esc(placed.paymentRef)}</span></div>` : ''}
        ${placed.paymentPending ? `<div class="d-line"><span>Status</span><span style="color:var(--warn)">Verifying your payment</span></div>` : ''}
        <div class="d-line"><span>Delivering to</span><span style="text-align:right;max-width:60%">${JMC.esc(placed.address.line1)}, ${JMC.esc(placed.address.city)} — ${JMC.esc(placed.address.pin)}</span></div>
        <div class="d-line total"><span>Total paid</span><b>${JMC.rs(placed.total)}</b></div>
      </div>
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
        <a href="orders.html" class="btn btn-solid">Track this order</a>
        <a href="shop.html" class="btn btn-line">Keep shopping</a>
      </div>
    </div>`;
}

window.onJMCLive = key => { if (key === JMC.K.carts && step === 1) render(); };
render();
JMC.renderFooter();
</script>
</body>
</html>
