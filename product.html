<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product</title>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/luxe.css">
<style>
.pd{display:grid;grid-template-columns:1.05fr 1fr;gap:56px;align-items:start;}
.pd-media{position:sticky;top:100px;}
.thumbs{display:flex;flex-direction:column;gap:10px;}
.thumb{aspect-ratio:3/4;overflow:hidden;border:1px solid var(--line);border-radius:2px;
  cursor:pointer;opacity:.55;transition:.25s;background:var(--surface-2);}
.thumb.on,.thumb:hover{opacity:1;border-color:var(--gold);}
.thumb img{width:100%;height:100%;object-fit:cover;}
.stage{aspect-ratio:3/4;overflow:hidden;border-radius:var(--radius);background:var(--surface-2);
  position:relative;cursor:zoom-in;border:1px solid var(--line);}
.stage img{width:100%;height:100%;object-fit:cover;transition:transform .5s;}
.stage.zoom img{transform:scale(1.9);cursor:zoom-out;}
.res-tag{position:absolute;bottom:12px;left:12px;font-family:var(--f-mono);font-size:9px;
  letter-spacing:.16em;padding:5px 10px;border-radius:2px;background:rgba(20,12,24,.72);color:#E4C879;}

.pd-info h1{font-size:clamp(30px,3.4vw,44px);margin:14px 0 12px;}
.pd-price{display:flex;align-items:baseline;gap:13px;flex-wrap:wrap;margin:20px 0;
  padding:20px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
.pd-price .price{font-size:30px;font-family:var(--f-mono);font-weight:600;}
.pd-desc{font-size:15px;line-height:1.9;color:var(--ink-soft);margin-bottom:26px;}
.opt-row{margin-bottom:22px;}
.opt-row h5{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-soft);margin-bottom:11px;display:flex;justify-content:space-between;}
.pills{display:flex;gap:9px;flex-wrap:wrap;}
.pill{padding:10px 19px;border:1px solid var(--line-2);border-radius:2px;cursor:pointer;
  font-family:var(--f-mono);font-size:11.5px;transition:.25s;background:var(--surface);}
.pill:hover{border-color:var(--gold);}
.pill.on{background:var(--btn-bg);color:var(--btn-fg);border-color:var(--btn-bg);}
.buy-row{display:flex;gap:12px;margin:28px 0 22px;flex-wrap:wrap;}
.buy-row .btn{flex:1;min-width:150px;padding:17px 20px;}
.trust{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:22px 0;
  border-top:1px solid var(--line);}
.trust div{display:flex;gap:11px;align-items:flex-start;font-size:12.5px;color:var(--ink-soft);}
.trust i{font-size:20px;color:var(--gold);flex:none;}
.spec{width:100%;font-size:13.5px;margin-top:6px;}
.spec td{padding:11px 0;border-bottom:1px solid var(--line);vertical-align:top;}
.spec td:first-child{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-faint);width:110px;padding-right:16px;}
.tabs{display:flex;gap:28px;border-bottom:1px solid var(--line);margin-bottom:28px;flex-wrap:wrap;}
.tab{padding:14px 0;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ink-faint);cursor:pointer;border-bottom:2px solid transparent;
  background:none;border-top:none;border-left:none;border-right:none;transition:.25s;}
.tab.on{color:var(--ink);border-bottom-color:var(--gold);}
.rev{padding:22px 0;border-bottom:1px solid var(--line);}
.rev-top{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.rev-av{width:36px;height:36px;border-radius:50%;background:linear-gradient(140deg,var(--brand),var(--gold));
  color:#fff;display:grid;place-items:center;font-family:var(--f-mono);font-size:11.5px;flex:none;}
.rev p{font-size:14px;line-height:1.8;color:var(--ink-soft);}
.rate-pick{display:flex;gap:5px;font-size:26px;color:var(--line-2);cursor:pointer;}
.rate-pick span{transition:.15s;}
.rate-pick span.on{color:var(--gold);}
.rev-layout{display:grid;grid-template-columns:1fr 340px;gap:44px;align-items:start;}
@media(max-width:900px){.rev-layout{grid-template-columns:1fr!important;gap:26px;}}
@media(max-width:960px){
  .pd{grid-template-columns:1fr;gap:32px;}
  .pd-media{position:static;}
  .thumbs{flex-direction:row;order:2;}
  .thumb{width:74px;flex:none;}
}
</style>
</head>
<body>

<section class="section tight wrap" style="padding-top:34px">
  <div class="crumbs" id="crumbs"></div>
  <div class="pd" id="pd"></div>
</section>

<section class="section tight wrap" id="detail-tabs"></section>

<section class="section tight wrap">
  <div class="section-head"><div class="eyebrow">You may also like</div>
    <h2 class="display-m">From the same collection</h2></div>
  <div class="grid grid-4" id="related"></div>
</section>

<script src="assets/js/data.js"></script>
<script src="assets/js/brand.js"></script>
<script src="assets/js/qr.js"></script>
<script src="assets/js/carousel.js"></script>
<script src="assets/js/payments.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/fx.js"></script>
<script>
JMC.boot('shop.html');

const sku = new URLSearchParams(location.search).get('sku');
const p = JMC.productBySku(sku);

if (!p) {
  document.getElementById('pd').innerHTML =
    `<div class="empty-state" style="grid-column:1/-1"><i class='bx bx-package'></i>
      <h4>We can't find that piece</h4><p>It may have been renamed or retired.</p>
      <a href="shop.html" class="btn btn-solid">Back to the collection</a></div>`;
} else {
  document.title = p.name + ' — Jay Mataji Creation';
  let size = p.sizes[0], color = p.colors[0], qty = 1, shot = 0;
  const off = p.mrp > p.price ? Math.round((1 - p.price/p.mrp)*100) : 0;
  const stars = '★★★★★'.slice(0, Math.round(p.rating)) + '☆☆☆☆☆'.slice(0, 5 - Math.round(p.rating));

  document.getElementById('crumbs').innerHTML =
    `<a href="index.html">Home</a> / <a href="shop.html">Collection</a> / <a href="shop.html?cat=${p.cat}">${p.cat}</a> / ${JMC.esc(p.name)}`;

  function draw(){
    const wished = JMC.wishlist().includes(p.sku);
    document.getElementById('pd').innerHTML = `
      <div class="pd-media">
        <div id="shots"></div>
      </div>
      <div class="pd-info">
        <div class="eyebrow">${p.sku} · ${p.cat}</div>
        <h1>${JMC.esc(p.name)}</h1>
        <div class="rating-line"><span class="stars">${stars}</span>
          <span>${p.rating} · ${p.reviews} ratings</span></div>
        <div class="pd-price">
          <span class="price">${JMC.rs(p.price)}</span>
          ${off ? `<span class="mrp">${JMC.rs(p.mrp)}</span>
            <span class="badge ok">Save ${JMC.rs(p.mrp - p.price)} · ${off}% off</span>` : ''}
        </div>
        <p class="pd-desc">${JMC.esc(p.desc)}</p>
        <div class="opt-row"><h5><span>Size</span><span style="color:var(--gold)">Free adjustment</span></h5>
          <div class="pills">${p.sizes.map(s => `<button class="pill ${s===size?'on':''}" data-size="${s}">${s}</button>`).join('')}</div></div>
        <div class="opt-row"><h5>Colour</h5>
          <div class="pills">${p.colors.map(c => `<button class="pill ${c===color?'on':''}" data-color="${JMC.esc(c)}">${JMC.esc(c)}</button>`).join('')}</div></div>
        <div class="opt-row"><h5>Quantity</h5>
          <div class="qty" style="transform:scale(1.15);transform-origin:left">
            <button id="qm" aria-label="Decrease">−</button><span id="qv">1</span><button id="qp" aria-label="Increase">+</button></div>
          <div style="margin-top:12px;font-size:12.5px;color:${p.stock>0?'var(--ok)':'var(--bad)'}">
            ${p.stock > 0 ? (p.stock < 5 ? '● Only ' + p.stock + ' left in this run' : '● In stock, ships in 2 days') : '● Sold out — join the waitlist'}</div>
        </div>
        <div class="buy-row">
          <button class="btn btn-solid" id="add" ${p.stock<=0?'disabled':''}><i class='bx bx-shopping-bag'></i> Add to bag</button>
          <button class="btn btn-gold" id="buy" ${p.stock<=0?'disabled':''}><i class='bx bx-bolt'></i> Buy now</button>
          <button class="btn btn-line" id="wish" style="flex:0 0 56px;min-width:56px" aria-label="Save to wishlist">
            <i class='bx bx${wished?'s':''}-heart' style="font-size:19px;color:${wished?'var(--bad)':'inherit'}"></i></button>
        </div>
        <div class="trust">
          <div><i class='bx bx-package'></i><span>Free delivery over ₹2,999, dispatched from Ahmedabad</span></div>
          <div><i class='bx bx-refresh'></i><span>7-day exchange on unworn pieces</span></div>
          <div><i class='bx bx-ruler'></i><span>Free length &amp; sleeve adjustment before dispatch</span></div>
          <div><i class='bx bx-rupee'></i><span>Cash on delivery available across India</span></div>
        </div>
      </div>`;

    JMCCarousel.shots('#shots', p.gallery, { alt: p.name });
    document.querySelectorAll('[data-size]').forEach(b => b.onclick = () => { size = b.dataset.size; draw(); });
    document.querySelectorAll('[data-color]').forEach(b => b.onclick = () => { color = b.dataset.color; draw(); });
    document.getElementById('qp').onclick = () => { qty = Math.min(20, qty+1); document.getElementById('qv').textContent = qty; };
    document.getElementById('qm').onclick = () => { qty = Math.max(1, qty-1); document.getElementById('qv').textContent = qty; };
    document.getElementById('add').onclick = () => { JMC.addToCart(p.sku, qty, size); JMC.openDrawer(); };
    document.getElementById('buy').onclick = () => { JMC.addToCart(p.sku, qty, size); location.href = 'cart.html'; };
    document.getElementById('wish').onclick = () => { JMC.toggleWish(p.sku); draw(); };
  }
  draw();

  /* ── tabs ── */
  function paintTabs(active){
    const revs = JMC.reviews(p.sku);
    const panes = {
      specs:`<table class="spec">
        <tr><td>Fabric</td><td>${JMC.esc(p.fabric)}</td></tr>
        <tr><td>Work</td><td>${JMC.esc(p.work)}</td></tr>
        <tr><td>Care</td><td>${JMC.esc(p.care)}</td></tr>
        <tr><td>Sizes</td><td>${p.sizes.join(' · ')} — measured on the body, not the garment. Tell us your bust, waist and hip at checkout and we adjust free.</td></tr>
        <tr><td>Colours</td><td>${p.colors.join(' · ')}</td></tr>
        <tr><td>Origin</td><td>Cut, embroidered and finished in Maninagar, Ahmedabad</td></tr>
        <tr><td>SKU</td><td>${p.sku}</td></tr></table>`,
      delivery:`<div class="lede" style="max-width:70ch">
        <p style="margin-bottom:14px"><b>Dispatch</b> — ready pieces leave within 2 working days. Made-to-measure and bridal take 3 to 4 weeks; we confirm the date on call before we start.</p>
        <p style="margin-bottom:14px"><b>Delivery</b> — free above ₹2,999, otherwise ₹99. Metro cities in 3–4 days, rest of India in 5–7. You get a tracking link the moment it ships.</p>
        <p style="margin-bottom:14px"><b>Exchange</b> — 7 days from delivery on unworn, untagged pieces. We pay the return pickup once per order.</p>
        <p><b>Bridal</b> — made to your measurements, so not returnable. That is why we do two fittings first.</p></div>`,
      reviews:`
        <div style="display:grid;grid-template-columns:1fr 340px;gap:44px;align-items:start" class="rev-layout">
          <div>${ revs.length ? revs.map(r => `
            <div class="rev"><div class="rev-top">
              <div class="rev-av">${JMC.esc(r.name.slice(0,2).toUpperCase())}</div>
              <div><b style="font-size:13.5px">${JMC.esc(r.name)}</b>
                <div class="stars" style="font-size:11px">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</div></div>
              <span style="margin-left:auto;font-family:var(--f-mono);font-size:10px;color:var(--ink-faint)">
                ${new Date(r.at).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}</span>
            </div><p>${JMC.esc(r.text)}</p></div>`).join('')
            : `<div class="empty-state" style="text-align:left;padding:20px 0"><h4>No reviews yet</h4>
               <p>Be the first to tell others how this piece fits.</p></div>` }</div>
          <div style="background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:26px">
            <h4 style="font-family:var(--f-display);font-size:21px;margin-bottom:16px">Write a review</h4>
            <div class="field"><label>Your rating</label>
              <div class="rate-pick" id="rate">${[1,2,3,4,5].map(i => `<span data-r="${i}">★</span>`).join('')}</div></div>
            <div class="field"><label>Your review</label>
              <textarea class="input" id="rev-text" placeholder="How does it fit? How is the fabric after a wash?"></textarea></div>
            <div class="err-msg" id="rev-err"></div>
            <button class="btn btn-solid btn-block" id="rev-send">Post review</button>
          </div></div>`
    };
    document.getElementById('detail-tabs').innerHTML = `
      <div class="tabs" id="tabbar">
        <button class="tab ${active==='specs'?'on':''}" data-tab="specs">Details &amp; care</button>
        <button class="tab ${active==='delivery'?'on':''}" data-tab="delivery">Delivery &amp; exchange</button>
        <button class="tab ${active==='reviews'?'on':''}" data-tab="reviews">Reviews (${revs.length})</button>
      </div>
      <div id="pane">${panes[active]}</div>`;
    document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => paintTabs(b.dataset.tab));

    if (active === 'reviews') {
      let stars5 = 5;
      const paint = () => document.querySelectorAll('#rate span').forEach(s =>
        s.classList.toggle('on', +s.dataset.r <= stars5));
      document.querySelectorAll('#rate span').forEach(s => s.onclick = () => { stars5 = +s.dataset.r; paint(); });
      paint();
      document.getElementById('rev-send').onclick = () => {
        const u = JMC.session(), err = document.getElementById('rev-err');
        if (!u) { err.textContent = 'Sign in to post a review.'; setTimeout(() => location.href = 'login.html', 900); return; }
        const txt = document.getElementById('rev-text').value.trim();
        if (txt.length < 10) { err.textContent = 'Write at least a line or two.'; return; }
        JMC.addReview(p.sku, { name:u.name, rating:stars5, text:txt });
        JMC.toast('Review posted — thank you', 'ok');
        paintTabs('reviews');
      };
    }
  }
  paintTabs('specs');

  const rel = JMC.products().filter(x => x.cat === p.cat && x.sku !== p.sku).slice(0,4);
  const fill = rel.length < 4 ? JMC.products().filter(x => x.sku !== p.sku && !rel.includes(x)).slice(0, 4 - rel.length) : [];
  document.getElementById('related').innerHTML = [...rel, ...fill].map(JMC.cardHTML).join('');
  JMC.wireCards(); JMC.revealOnScroll();
  document.querySelectorAll('#related .card').forEach(c => c.classList.add('in'));
}

JMC.renderFooter();
</script>
</body>
</html>
