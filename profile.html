<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My profile — Jay Mataji Creation</title>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/luxe.css">
<style>
.acct{display:grid;grid-template-columns:264px 1fr;gap:40px;align-items:start;}
.side{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;position:sticky;top:100px;}
.side-top{padding:30px 24px;text-align:center;border-bottom:1px solid var(--line);background:var(--surface-2);}
.side-av{width:78px;height:78px;border-radius:50%;margin:0 auto 15px;
  background:linear-gradient(140deg,var(--brand),var(--gold));color:#fff;display:grid;place-items:center;
  font-family:var(--f-mono);font-size:25px;font-weight:600;box-shadow:var(--shadow-m);}
.side-top b{font-family:var(--f-display);font-size:21px;font-weight:500;display:block;}
.side-top small{font-size:12.5px;color:var(--ink-soft);word-break:break-all;display:block;margin-top:3px;}
.side-nav{padding:8px;}
.side-nav a{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:4px;
  font-size:13.5px;color:var(--ink-soft);transition:.2s;}
.side-nav a i{font-size:19px;}
.side-nav a:hover{background:var(--surface-2);color:var(--ink);}
.side-nav a.on{background:var(--btn-bg);color:var(--btn-fg);}
.side-nav a.danger:hover{color:var(--bad);}
.side-nav .n{margin-left:auto;font-family:var(--f-mono);font-size:10px;}

.stat-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:32px;}
.sc{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;}
.sc i{font-size:22px;color:var(--gold);}
.sc b{font-family:var(--f-display);font-size:30px;font-weight:500;display:block;margin:10px 0 3px;}
.sc span{font-family:var(--f-mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:28px;margin-bottom:24px;}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:14px;
  margin-bottom:22px;flex-wrap:wrap;}
.panel-head h3{font-size:21px;}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.addr-card{border:1px solid var(--line);border-radius:var(--radius);padding:18px;
  font-size:13.5px;color:var(--ink-soft);line-height:1.75;position:relative;}
.addr-card b{color:var(--ink);display:block;margin-bottom:5px;font-size:14px;}
.addr-card .x{position:absolute;top:12px;right:12px;background:none;border:none;cursor:pointer;
  color:var(--ink-faint);font-size:18px;}
.addr-card .x:hover{color:var(--bad);}
.mini-order{display:flex;gap:15px;align-items:center;padding:15px 0;border-bottom:1px solid var(--line);}
.mini-order:last-child{border:none;}
.mini-order img{width:52px;height:66px;object-fit:cover;border-radius:2px;flex:none;background:var(--surface-2);}
.mini-order .m{flex:1;min-width:0;}
.mini-order b{font-size:13.5px;display:block;}
.mini-order small{font-family:var(--f-mono);font-size:10px;color:var(--ink-faint);letter-spacing:.08em;}
@media(max-width:960px){.acct{grid-template-columns:1fr;}.side{position:static;}
  .stat-cards{grid-template-columns:repeat(2,1fr);}.two{grid-template-columns:1fr;}}
</style>
</head>
<body>

<section class="page-hero">
  <div class="wrap">
    <div class="crumbs"><a href="index.html">Home</a> / My profile</div>
    <h1 class="display-l">My profile</h1>
  </div>
</section>

<section class="section tight wrap"><div class="acct" id="root"></div></section>

<script src="assets/js/data.js"></script>
<script src="assets/js/brand.js"></script>
<script src="assets/js/qr.js"></script>
<script src="assets/js/carousel.js"></script>
<script src="assets/js/payments.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/fx.js"></script>
<script>
JMC.boot('');
if (!JMC.requireAuth('profile.html')) throw new Error('redirecting');

function sideHTML(u, on){
  const ini = u.name.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
  return `<aside class="side">
    <div class="side-top">
      <div class="side-av">${JMC.esc(ini)}</div>
      <b>${JMC.esc(u.name)}</b><small>${JMC.esc(u.email)}</small>
      ${u.role==='admin'?'<span class="pm-tag" style="margin-top:10px">Admin</span>':
        '<span class="badge" style="margin-top:10px">Member since '+new Date(u.createdAt).getFullYear()+'</span>'}
    </div>
    <nav class="side-nav">
      <a href="profile.html" class="${on==='profile'?'on':''}"><i class='bx bx-user'></i> Profile</a>
      <a href="orders.html"><i class='bx bx-package'></i> My orders <span class="n">${JMC.myOrders().length}</span></a>
      <a href="wishlist.html"><i class='bx bx-heart'></i> Wishlist <span class="n">${JMC.wishlist().length}</span></a>
      <a href="cart.html"><i class='bx bx-shopping-bag'></i> My bag <span class="n">${JMC.cartCount()}</span></a>
      ${u.role==='admin'?`<a href="admin.html"><i class='bx bx-grid-alt'></i> Admin dashboard</a>`:''}
      <div class="divider" style="height:1px;background:var(--line);margin:8px 6px"></div>
      <a href="#" class="danger" id="signout"><i class='bx bx-log-out'></i> Sign out</a>
    </nav>
  </aside>`;
}

function render(){
  const u = JMC.currentUser();
  if (!u) { location.href = 'login.html'; return; }
  const mine = JMC.myOrders();
  const spent = mine.filter(o => o.status !== 'Cancelled').reduce((n,o) => n + o.total, 0);
  const pieces = mine.reduce((n,o) => n + o.items.reduce((k,i) => k + i.qty, 0), 0);
  const recent = mine.slice(0,4);

  document.getElementById('root').innerHTML = sideHTML(u,'profile') + `<div>
    <div class="stat-cards">
      <div class="sc"><i class='bx bx-package'></i><b>${mine.length}</b><span>Orders placed</span></div>
      <div class="sc"><i class='bx bx-purchase-tag'></i><b>${pieces}</b><span>Pieces bought</span></div>
      <div class="sc"><i class='bx bx-rupee'></i><b>${JMC.rs(spent)}</b><span>Total spent</span></div>
      <div class="sc"><i class='bx bx-heart'></i><b>${JMC.wishlist().length}</b><span>Saved pieces</span></div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>Your details</h3>
        <button class="btn btn-line btn-sm" id="edit-toggle">Edit details</button></div>
      <div id="details-view">
        <div class="two">
          <div><div class="mono" style="color:var(--ink-faint);margin-bottom:6px">Full name</div>
            <div style="font-size:15px">${JMC.esc(u.name)}</div></div>
          <div><div class="mono" style="color:var(--ink-faint);margin-bottom:6px">Email address</div>
            <div style="font-size:15px;word-break:break-all">${JMC.esc(u.email)}</div></div>
        </div>
        <div class="two" style="margin-top:20px">
          <div><div class="mono" style="color:var(--ink-faint);margin-bottom:6px">Mobile number</div>
            <div style="font-size:15px">${JMC.esc(u.phone||'Not added')}</div></div>
          <div><div class="mono" style="color:var(--ink-faint);margin-bottom:6px">Account created</div>
            <div style="font-size:15px">${new Date(u.createdAt).toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'})}</div></div>
        </div>
      </div>
      <div id="details-edit" class="hidden">
        <div class="two">
          <div class="field"><label>Full name</label><input class="input" id="e-name" value="${JMC.esc(u.name)}"></div>
          <div class="field"><label>Mobile number</label><input class="input" id="e-phone" value="${JMC.esc(u.phone||'')}"></div>
        </div>
        <div class="field"><label>Email address</label><input class="input" id="e-email" value="${JMC.esc(u.email)}"></div>
        <div class="err-msg" id="e-err"></div>
        <div style="display:flex;gap:11px"><button class="btn btn-solid btn-sm" id="save-details">Save changes</button>
          <button class="btn btn-line btn-sm" id="cancel-details">Cancel</button></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>Saved addresses</h3>
        <span class="mono" style="color:var(--ink-faint)">${(u.addresses||[]).length} saved</span></div>
      ${ (u.addresses||[]).length ? `<div class="two">${u.addresses.map((a,i) => `
        <div class="addr-card"><button class="x" data-addr="${i}" aria-label="Remove address"><i class='bx bx-x'></i></button>
          <b>${JMC.esc(a.name)}</b>${JMC.esc(a.line1)}<br>${JMC.esc(a.city)}, ${JMC.esc(a.state)} — ${JMC.esc(a.pin)}
          ${a.landmark?'<br>Near '+JMC.esc(a.landmark):''}<br>
          <span style="font-family:var(--f-mono);font-size:11px">${JMC.esc(a.phone)}</span></div>`).join('')}</div>`
        : `<p style="font-size:13.5px;color:var(--ink-soft)">Addresses you use at checkout are saved here automatically.</p>` }
    </div>

    <div class="panel">
      <div class="panel-head"><h3>Recent orders</h3><a href="orders.html" class="btn btn-line btn-sm">See all orders</a></div>
      ${ recent.length ? recent.map(o => `
        <div class="mini-order">
          <img src="assets/img/${o.items[0].img}-960.jpg" alt="">
          <div class="m"><b>${o.items[0].name}${o.items.length>1?` +${o.items.length-1} more`:''}</b>
            <small>${o.id} · ${new Date(o.createdAt).toLocaleDateString('en-IN',{day:'numeric',month:'short'})}</small></div>
          <span class="badge ${o.status==='Delivered'?'ok':o.status==='Cancelled'?'bad':'info'}">${o.status}</span>
          <b style="font-family:var(--f-mono);font-size:14px">${JMC.rs(o.total)}</b>
        </div>`).join('')
        : `<div class="empty-state" style="padding:26px 0"><h4>No orders yet</h4>
           <p>When you buy something it lands here, and you can follow it right to your door.</p>
           <a href="shop.html" class="btn btn-solid">Browse the collection</a></div>` }
    </div>

    <div class="panel">
      <div class="panel-head"><h3>Change password</h3></div>
      <div class="two">
        <div class="field"><label>Current password</label><input class="input" type="password" id="p-old" placeholder="••••••••"></div>
        <div class="field"><label>New password</label><input class="input" type="password" id="p-new" placeholder="At least 6 characters"></div>
      </div>
      <div class="err-msg" id="p-err"></div>
      <button class="btn btn-solid btn-sm" id="save-pw">Update password</button>
    </div>

    <div class="panel" style="border-color:rgba(163,43,54,.35)">
      <div class="panel-head"><h3 style="color:var(--bad)">Delete account</h3></div>
      <p style="font-size:13.5px;color:var(--ink-soft);margin-bottom:18px;max-width:60ch">
        This removes your profile, bag and wishlist from this device. Past orders stay in our records for accounting.</p>
      <button class="btn btn-line btn-sm" id="del-acct" style="border-color:var(--bad);color:var(--bad)">Delete my account</button>
    </div>
  </div>`;

  document.getElementById('signout').onclick = e => { e.preventDefault(); JMC.logout();
    JMC.toast('Signed out'); setTimeout(() => location.href='index.html', 500); };

  document.getElementById('edit-toggle').onclick = () => {
    document.getElementById('details-view').classList.toggle('hidden');
    document.getElementById('details-edit').classList.toggle('hidden');
  };
  document.getElementById('cancel-details').onclick = () => render();
  document.getElementById('save-details').onclick = () => {
    const name = document.getElementById('e-name').value.trim();
    const phone = document.getElementById('e-phone').value.trim();
    const email = document.getElementById('e-email').value.trim().toLowerCase();
    const err = document.getElementById('e-err');
    if (name.length < 2) return err.textContent = 'Enter your full name.';
    if (!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(email)) return err.textContent = 'Enter a valid email address.';
    if (email !== u.email && JMC.users().some(x => x.email === email)) return err.textContent = 'Another account already uses that email.';
    JMC.updateUser({ name, phone, email });
    JMC.toast('Details saved', 'ok');
    location.reload();
  };

  document.querySelectorAll('[data-addr]').forEach(b => b.onclick = () => {
    const list = (JMC.currentUser().addresses || []).slice();
    list.splice(+b.dataset.addr, 1);
    JMC.updateUser({ addresses:list }); JMC.toast('Address removed'); render();
  });

  document.getElementById('save-pw').onclick = async () => {
    const oldv = document.getElementById('p-old').value, nv = document.getElementById('p-new').value;
    const err = document.getElementById('p-err');
    const fresh = JMC.currentUser();
    if (await JMC.hash(oldv) !== fresh.pass) return err.textContent = 'Current password is not right.';
    if (nv.length < 6) return err.textContent = 'New password needs at least 6 characters.';
    JMC.updateUser({ pass: await JMC.hash(nv) });
    err.textContent = ''; JMC.toast('Password updated', 'ok');
    document.getElementById('p-old').value = ''; document.getElementById('p-new').value = '';
  };

  document.getElementById('del-acct').onclick = () => {
    if (!confirm('Delete your account? Your bag and wishlist go too. This cannot be undone.')) return;
    const list = JMC.users().filter(x => x.id !== u.id);
    JMC.write(JMC.K.users, list); JMC.logout();
    JMC.toast('Account deleted');
    setTimeout(() => location.href = 'index.html', 700);
  };
}

window.onJMCLive = key => { if (key === JMC.K.orders || key === JMC.K.carts || key === JMC.K.wish) render(); };
render();
JMC.renderFooter();
</script>
</body>
</html>
